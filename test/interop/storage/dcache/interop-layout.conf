# The image runs the domain "core", from this layout
dcache.broker.scheme = none
dcache.enable.space-reservation = false
dcache.zookeeper.connection = localhost:2181
# The test CA comes with no IGTF namespace or signing policy files
dcache.authn.namespace-mode = IGNORE
dcache.default-retention-policy = REPLICA
dcache.default-access-latency = ONLINE

chimera.db.user = dcache
chimera.db.password =
chimera.db.host = localhost
chimera.db.name = chimera
chimerashell.db.host = ${chimera.db.host}
chimerashell.db.user = ${chimera.db.user}
chimerashell.db.password = ${chimera.db.password}
chimerashell.db.name = ${chimera.db.name}

gplazma.multimap.file = /etc/dcache-interop/multi-mapfile
gplazma.omnisession.file = /etc/dcache-interop/omnisession.conf

[core]
[core/zookeeper]
[core/poolmanager]
[core/pnfsmanager]
[core/cleaner-disk]
[core/gplazma]
[core/transfermanagers]

[core/pool]
pool.name = pool-A
pool.path = /pool

# Uploads and downloads are redirected to the pool, over https (307 for a PUT with
# Expect: 100-continue, before the data)
[core/webdav]
webdav.authn.protocol = https
webdav.net.port = 2880
