name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: go test -race
        shell: bash # -o pipefail: the status of go test, not of tee
        run: |
          status=0
          go test -race -count=1 ./... 2>&1 | tee test.log || status=$?
          # The failures as annotations, which the pages of commits and pull requests show
          grep -E '^--- FAIL|^ +[A-Za-z0-9_]+\.go:[0-9]+: |^panic: ' test.log | head -30 |
            sed -e 's/%/%25/g' -e 's/^ *//' -e 's/^/::error title=go test::/' || true
          exit $status
      - name: Tests of worker processes running as Unix accounts (as root)
        run: go test -exec sudo -count=1 -run 'TestUnixUsers|TestWorker' ./internal/server ./internal/worker
      - name: cgroups of worker processes (as root, in a cgroup of their own)
        run: make test-cgroups

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build -o /dev/null . && go vet ./...
        env:
          GOARCH: ${{ matrix.goarch }}

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The latest Go release, which weed is built with: go.mod's is the oldest that
      # builds it, whose standard library may have vulnerabilities fixed since
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The latest Go release: until Go 1.27, -fuzztime could end a fuzz test that
      # found nothing with "context deadline exceeded" (go.dev/issue/75804)
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Fuzz parsers
        run: |
          for spec in $(grep -rho --include='*_test.go' '^func Fuzz[A-Za-z]*' internal | sort -u | sed 's/^func //'); do
            pkg=$(dirname $(grep -rl --include='*_test.go' "^func $spec(" internal))
            echo "::group::$pkg $spec"
            go test ./$pkg -run '^$' -fuzz "^$spec\$" -fuzztime 20s
            echo "::endgroup::"
          done

  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Podman
        run: command -v podman >/dev/null || { sudo apt-get -q update && sudo apt-get -q install -y podman; }
      - name: gfal2, davix and XRootD against weed
        run: make interop

  systemd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Podman
        run: command -v podman >/dev/null || { sudo apt-get -q update && sudo apt-get -q install -y podman; }
      - name: weed as the guide installs it, under systemd
        run: make test-systemd

  # The same on an AlmaLinux 10 virtual machine: EL10's kernel, and SELinux enforcing
  vm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Podman
        run: command -v podman >/dev/null || { sudo apt-get -q update && sudo apt-get -q install -y podman; }
      - name: KVM, qemu and xorriso
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules >/dev/null
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get -q -o Acquire::Retries=3 update && sudo apt-get -q -o Acquire::Retries=3 install -y --no-install-recommends qemu-system-x86 qemu-utils xorriso
      - name: weed's RPM on AlmaLinux 10, SELinux enforcing
        run: make test-vm

  # The administration guide, made from docs/src as make docs makes it, for GitHub
  # Pages (Settings, Pages, Source: GitHub Actions)
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the tags, whose guides the site has
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: pandoc, the version that made docs/html
        run: |
          v=$(sed -n 's/^PANDOC_VERSION = //p' docs/src/Makefile)
          curl -fsSL -o "$RUNNER_TEMP/pandoc.deb" "https://github.com/jgm/pandoc/releases/download/$v/pandoc-$v-1-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/pandoc.deb"
      - run: make docs
      - name: docs/html is what make docs makes from docs/src
        run: |
          test -z "$(git status --porcelain -- docs/html)" || {
            git status --short -- docs/html
            echo "::error title=docs::docs/html is not what make docs makes from docs/src: run make docs, and commit docs/html"
            exit 1
          }
      - name: The site, the guide of the latest release, and main's under dev/
        run: |
          site=$RUNNER_TEMP/site
          latest=$(git tag --list --sort=-v:refname 'v*' | grep -Ex 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -z "$latest" ]; then
            cp -R docs/html "$site" # no release yet
          else
            mkdir "$site"
            git archive "$latest" docs/html | tar -x --strip-components=2 -C "$site"
            cp -R docs/html "$site/dev"
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  # A release, for a tag vMAJOR.MINOR.PATCH once every other job has passed: weed
  # built on AlmaLinux 10 on a runner of each architecture (release/dist.sh), and its
  # RPM (release/rpm.sh), which is tested there as the guide installs it, then the
  # release on GitHub (README.txt, Releases)
  dist:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, build, vulncheck, fuzz, interop, systemd, vm, docs]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: almalinux:10
    steps:
      # git first: checkout then clones. A mirror may serve broken metadata for a while
      # ("repomd.xml parser error"): dnf reads only the repositories it needs, and
      # tries again
      - run: |
          for i in 1 2 3 4; do
            dnf -y -q --repo=baseos --repo=appstream install gcc git-core tar gzip gawk rpm-build systemd-rpm-macros && break
            [ $i = 4 ] && exit 1
            dnf -q clean metadata; sleep $((i * 15))
          done
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the tag, which gives weed its version
      # The latest Go release, whose standard library vulncheck checked
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          release/dist.sh
          release/rpm.sh dist/weed-*-linux-${{ matrix.arch }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.rpm

  # Podman, which the job container of dist has not
  dist-test:
    needs: dist
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist
      - name: Podman
        run: command -v podman >/dev/null || { sudo apt-get -q update && sudo apt-get -q install -y podman; }
      - name: The release's RPM as the guide installs it (make test-systemd)
        run: RPM=$(echo dist/weed-*.rpm) test/systemd/systemd.sh
      # The arm64 runners have no KVM
      - if: matrix.arch == 'amd64'
        name: KVM, qemu and xorriso
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules >/dev/null
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get -q -o Acquire::Retries=3 update && sudo apt-get -q -o Acquire::Retries=3 install -y --no-install-recommends qemu-system-x86 qemu-utils xorriso
      - if: matrix.arch == 'amd64'
        name: The release's RPM on AlmaLinux 10, SELinux enforcing (make test-vm)
        run: RPM=$(echo dist/weed-*.rpm) test/vm/vm.sh

  release:
    needs: dist-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: The release on GitHub, with the version's section of CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum weed-*.tar.gz weed-*.rpm >SHA256SUMS && cat SHA256SUMS)
          release/notes.sh "$TAG" >"$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --verify-tag --title "weed $TAG" --notes-file "$RUNNER_TEMP/notes.md" dist/*
