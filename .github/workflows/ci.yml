name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: go test -race
        shell: bash # -o pipefail: the status of go test, not of tee
        run: |
          status=0
          go test -race -count=1 ./... 2>&1 | tee test.log || status=$?
          # The failures as annotations, which the pages of commits and pull requests show
          grep -E '^--- FAIL|^ +[A-Za-z0-9_]+\.go:[0-9]+: |^panic: ' test.log | head -30 |
            sed -e 's/%/%25/g' -e 's/^ *//' -e 's/^/::error title=go test::/' || true
          exit $status
      - name: Tests of worker processes running as Unix accounts (as root)
        run: go test -exec sudo -count=1 -run 'TestUnixUsers|TestWorker' ./internal/server ./internal/worker
      - name: cgroups of worker processes (privileged container)
        run: make test-cgroups

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows, freebsd]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build -o /dev/null . && go vet ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The latest Go release, which weed is built with: go.mod's is the oldest that
      # builds it, whose standard library may have vulnerabilities fixed since
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Fuzz parsers
        run: |
          for spec in $(grep -rho --include='*_test.go' '^func Fuzz[A-Za-z]*' internal | sort -u | sed 's/^func //'); do
            pkg=$(dirname $(grep -rl --include='*_test.go' "^func $spec(" internal))
            echo "::group::$pkg $spec"
            go test ./$pkg -run '^$' -fuzz "^$spec\$" -fuzztime 20s
            echo "::endgroup::"
          done

  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gfal2, davix and XRootD against weed
        run: test/interop/interop.sh

  # The administration guide, made from docs/src as make docs makes it, for GitHub
  # Pages (Settings, Pages, Source: GitHub Actions)
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: pandoc, the version that made docs/html
        run: |
          v=$(sed -n 's/^PANDOC_VERSION = //p' docs/src/Makefile)
          curl -fsSL -o "$RUNNER_TEMP/pandoc.deb" "https://github.com/jgm/pandoc/releases/download/$v/pandoc-$v-1-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/pandoc.deb"
      - run: make docs
      - name: docs/html is what make docs makes from docs/src
        run: |
          test -z "$(git status --porcelain -- docs/html)" || {
            git status --short -- docs/html
            echo "::error title=docs::docs/html is not what make docs makes from docs/src: run make docs, and commit docs/html"
            exit 1
          }
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/html

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
